name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile*'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Dockerfile*'
      - 'configs/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select profile to build (or "all" for all profiles)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - personal
          - sarna
          - sdui
      platforms:
        description: 'Target platforms'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'

env:
  REGISTRY: docker.io
  IMAGE_NAME: rustamgk/dotfiles

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.profile == 'all' || contains(fromJSON('["personal", "sarna", "sdui"]'), inputs.profile) }}
    strategy:
      matrix:
        profile:
          - name: personal
            dockerfile: Dockerfile
            tag: latest
          - name: sarna
            dockerfile: Dockerfile.sarna
            tag: sarna
          - name: sdui
            dockerfile: Dockerfile.sdui
            tag: sdui
    
    # Skip profiles not selected in manual trigger
    name: Build ${{ matrix.profile.name }} profile
    
    steps:
    - name: Check if profile should be built
      id: should_build
      run: |
        if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
        elif [[ "${{ inputs.profile }}" == "all" || "${{ inputs.profile }}" == "${{ matrix.profile.name }}" ]]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
        else
          echo "should_build=false" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      if: steps.should_build.outputs.should_build == 'true'
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      if: steps.should_build.outputs.should_build == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: steps.should_build.outputs.should_build == 'true' && github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      if: steps.should_build.outputs.should_build == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ matrix.profile.tag }}
          type=sha,prefix=${{ matrix.profile.tag }}-

    - name: Build and push Docker image
      if: steps.should_build.outputs.should_build == 'true'
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.profile.dockerfile }}
        platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      if: steps.should_build.outputs.should_build == 'true' && github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
