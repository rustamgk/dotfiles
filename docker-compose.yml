# Docker Compose for Personal Development Environment (Linux/macOS)
version: '3.8'

services:
  devenv:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile}
    container_name: ${CONTAINER_NAME:-rustam-devenv-personal}
    image: ${IMAGE_NAME:-rustam-devenv:personal}
    hostname: devenv-personal
    volumes:
      # Personal environment mounts
      - ${WORKSPACE_PATH:-./workspace}:/home/rustamgk/workspace
      - ${HELM_PATH:-./helm}:/home/rustamgk/helm
      # SSH keys (optional)
      - ${HOME}/.ssh:/home/rustamgk/.ssh:ro
      # Git config persistence
      - devenv-personal-git:/home/rustamgk/.git-local
      # Tmux sessions persistence
      - devenv-personal-tmux:/home/rustamgk/.tmux-sessions
      # ZSH history persistence
      - devenv-personal-zsh:/home/rustamgk/.zsh-history
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8080:8080"
      - "9000:9000"
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - WORK_PROFILE=personal
    stdin_open: true
    tty: true
    networks:
      - devnet-personal

networks:
  devnet-personal:
    driver: bridge

volumes:
  devenv-personal-git:
  devenv-personal-tmux:
  devenv-personal-zsh:
