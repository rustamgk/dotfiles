# Docker Compose for Windows (Native Docker Desktop)
version: '3.8'

services:
  devenv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rustam-devenv
    hostname: devenv
    volumes:
      # Windows native mounts
      - C:\workspace:/home/rustamgk/workspace
      - C:\helm:/home/rustamgk/helm
      # SSH keys (optional - adjust path as needed)
      - ${USERPROFILE}\.ssh:/home/rustamgk/.ssh:ro
      # Persistence volumes
      - devenv-git:/home/rustamgk/.git-local
      - devenv-tmux:/home/rustamgk/.tmux-sessions
      - devenv-zsh:/home/rustamgk/.zsh-history
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8080:8080"
      - "9000:9000"
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
    stdin_open: true
    tty: true
    networks:
      - devnet

networks:
  devnet:
    driver: bridge

volumes:
  devenv-git:
  devenv-tmux:
  devenv-zsh:
