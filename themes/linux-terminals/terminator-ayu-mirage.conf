# Terminator Ayu Mirage Theme Configuration
# Add this profile to your ~/.config/terminator/config file

[profiles]
  [[ayu-mirage]]
    background_color = "#1f2430"
    foreground_color = "#cbccc6"
    cursor_color = "#ffcc66"
    cursor_color_fg = False
    
    # Disable the default system colors
    use_system_font = False
    font = "JetBrains Mono 11"
    
    # Color palette
    palette = "#191e2a:#f28779:#bae67e:#ffcc66:#73d0ff:#d4bfff:#95e6cb:#cbccc6:#2d3640:#f28779:#bae67e:#ffcc66:#73d0ff:#d4bfff:#95e6cb:#fcfcfc"
    
    # Additional appearance settings
    background_darkness = 1.0
    background_type = solid
    copy_on_selection = False
    scroll_on_keystroke = True
    scroll_on_output = False
    scrollbar_position = hidden
    show_titlebar = False
    
    # Window settings
    urgent_bell = True
    audible_bell = False
    visible_bell = False
    
    # Scrollback
    scrollback_lines = 5000
    scrollback_infinite = False

# Example complete config structure:
# [global_config]
# [keybindings]
# [profiles]
#   [[default]]
#     # your default profile settings
#   [[ayu-mirage]]
#     # the above ayu-mirage settings
# [layouts]
#   [[default]]
#     [[[child1]]]
#       parent = window0
#       profile = ayu-mirage
#       type = Terminal
#     [[[window0]]]
#       parent = ""
#       type = Window
# [plugins]
