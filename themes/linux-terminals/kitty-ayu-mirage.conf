# Ayu Mirage for Kitty Terminal
# Add this to your kitty.conf file

# Background and foreground
background #1f2430
foreground #cbccc6

# Cursor
cursor #ffcc66
cursor_text_color #1f2430

# Selection
selection_background #33415e
selection_foreground #cbccc6

# URL
url_color #73d0ff

# Normal colors
color0 #191e2a
color1 #f28779
color2 #bae67e
color3 #ffcc66
color4 #73d0ff
color5 #d4bfff
color6 #95e6cb
color7 #cbccc6

# Bright colors
color8 #2d3640
color9 #f28779
color10 #bae67e
color11 #ffcc66
color12 #73d0ff
color13 #d4bfff
color14 #95e6cb
color15 #fcfcfc

# Window borders
active_border_color #73d0ff
inactive_border_color #2d3640

# Tab bar
active_tab_background #73d0ff
active_tab_foreground #1f2430
inactive_tab_background #2d3640
inactive_tab_foreground #cbccc6
