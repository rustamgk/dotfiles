# -----------------------------------------
# Kitty Quick Access Terminal (Quake mode)
# Docs: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/
# Managed via: github.com/rustamgk/dotfiles
# -----------------------------------------

# ---- Position & size ----
edge              top
lines             65

# ---- Behaviour ----
hide_on_focus_loss yes
start_as_hidden    no

# ---- Appearance ----
background_opacity 0.92

# ---- Kitty overrides (apply only to the quake window) ----
# Keep the same font as main config
kitty_override font_family=JetBrainsMono Nerd Font
kitty_override font_size=14.0
# Slightly larger padding for the floating window feel
kitty_override window_padding_width=10
