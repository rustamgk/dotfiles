# -----------------------------------------
# Kitty Terminal Config
# Author: Galimyanov Rustam
# Managed via: github.com/rustamgk/dotfiles
# -----------------------------------------

# ---- Font ----
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ---- Cursor ----
cursor_shape                underline
cursor_underline_thickness  2.0
cursor_beam_thickness       1.5
cursor_blink_interval       -1
cursor_stop_blinking_after  0

# ---- Scrollback ----
scrollback_lines            9000
scrollback_indicator_opacity 1.0
scrollback_pager            less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ---- Mouse ----
mouse_hide_wait 2.0
open_url_with   default
url_style       curly
detect_urls     yes

# ---- Window ----
window_padding_width       8
window_margin_width        5
single_window_margin_width 5
window_border_width        4
draw_minimal_borders       yes
hide_window_decorations    no
remember_window_size       yes
confirm_os_window_close    0
copy_on_select             yes

# Initial size — useful for quake-mode launch scripts
# Launch with: kitty --single-instance --class=kitty-quake
initial_window_width  120c
initial_window_height 35c

# ---- Tabs ----
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

# ---- Bell ----
enable_audio_bell no
visual_bell_duration 0.0

# ---- Performance ----
repaint_delay  8
input_delay    3
sync_to_monitor yes

# ---- Remote control ----
# Required for quake-mode toggle via external scripts / hotkey daemons
allow_remote_control yes
listen_on unix:/tmp/kitty-quake

# ---- Shell ----
# Let the shell config pick up zsh via PATH; matches tmux.conf OS logic
shell            .
editor           .
shell_integration enabled no-cursor
update_check_interval 0

# ---- Keybinding modifier ----
kitty_mod ctrl+shift

# ---- macOS ----
macos_option_as_alt                yes
macos_hide_from_tasks              no
macos_quit_when_last_window_closed no
macos_titlebar_color               background

# ============================================================
# Quake / Quick-access terminal — CTRL+`
# Uses the native built-in kitten (kitty >= 0.42.0)
# Config: ~/.config/kitty/quick-access-terminal.conf
# ============================================================
# From inside kitty: ctrl+` launches/toggles the quake window.
map ctrl+grave kitten quick_access_terminal

# For a true GLOBAL hotkey (works from any app on macOS):
#   1. Open Shortcuts.app → New Shortcut → Add Action → Run Shell Script
#   2. Command: /Applications/kitty.app/Contents/MacOS/kitten quick-access-terminal
#   3. Assign the shortcut ctrl+` in Shortcut settings → Details
# ============================================================

# ---- Keybindings ----
# Tabs
map kitty_mod+t new_tab_with_cwd
map kitty_mod+w close_tab
map kitty_mod+l next_tab
map kitty_mod+h previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5

# Splits (windows inside a tab)
map kitty_mod+enter new_window_with_cwd
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+r start_resizing_window

# Font size
map kitty_mod+equal  change_font_size all +1.0
map kitty_mod+minus  change_font_size all -1.0
map kitty_mod+0      change_font_size all 0

# Clipboard
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Scrollback
map kitty_mod+k scroll_line_up
map kitty_mod+j scroll_line_down
map kitty_mod+u scroll_page_up
map kitty_mod+d scroll_page_down
map kitty_mod+g scroll_to_top
map kitty_mod+shift+g scroll_to_bottom

# ---- Ayu Mirage Theme ----
background            #1f2430
foreground            #cbccc6

cursor                #ffcc66
cursor_text_color     #1f2430

selection_background  #33415e
selection_foreground  #cbccc6

url_color             #73d0ff

# Normal colors
color0  #191e2a
color1  #f28779
color2  #bae67e
color3  #ffcc66
color4  #73d0ff
color5  #d4bfff
color6  #95e6cb
color7  #cbccc6

# Bright colors
color8  #2d3640
color9  #f28779
color10 #bae67e
color11 #ffcc66
color12 #73d0ff
color13 #d4bfff
color14 #95e6cb
color15 #fcfcfc

# Window borders
active_border_color   #73d0ff
inactive_border_color #2d3640

# Tab bar
active_tab_background   #73d0ff
active_tab_foreground   #1f2430
inactive_tab_background #2d3640
inactive_tab_foreground #cbccc6
